name: sync

on:
  push:
    branches: [ main ]
  schedule:
    - cron:  '0 */8 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-aliyun:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Skopeo 1.14.1 lacks the platform-filtering flags used by sync.sh.
        SKOPEO_VERSION="v1.24.0"
        wget -q "https://github.com/lework/skopeo-binary/releases/download/${SKOPEO_VERSION}/skopeo-linux-amd64" -O /tmp/skopeo
        chmod +x /tmp/skopeo
        /tmp/skopeo --version
        /tmp/skopeo copy --help | grep -- --multi-arch
    - name: generate_sync_yaml
      timeout-minutes: 30
      run: |
        python generate_sync_yaml.py
    
    - name: sync image
      env:
        HUB_USERNAME: ${{ secrets.HUB_USERNAME }}
        HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
      run: |
        bash sync.sh
